[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-conformance"
version = "0.1.0.dev0"
description = "Conformance runs against the OpenTelemetry browser semantic conventions."
requires-python = ">=3.10"
dependencies = ["opentelemetry-conformance"]

[project.entry-points.opentelemetry_conformance_runners]
browser-conformance = "browser_conformance:browser_session"

[project.scripts]
browser-conformance = "browser_conformance:cli"

[tool.uv.sources]
opentelemetry-conformance = { path = "../../runner", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/browser_conformance"]
